[package]
name = "step-staking"
version = "0.2.0"
description = "Single-token staking vault with proportional receipt shares"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "step_staking"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
local-testing = []
test-id = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
